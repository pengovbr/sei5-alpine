Listen 8000
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 15

Alias "/sei" "/opt/sei/web"
Alias "/sip" "/opt/sip/web"
Alias "/infra_css" "/opt/infra/infra_css"
Alias "/infra_js" "/opt/infra/infra_js"

LogFormat "%h %{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

SetEnvIfNoCase user-agent "Microsoft Data Access Internet Publishing Provider Protocol Discovery" bad_bot=1
<FilesMatch "(.*)">
   Order Allow,Deny
   Allow from all
   Deny from env=bad_bot
</FilesMatch>

<VirtualHost *:8000>
    DocumentRoot /var/www/html
    ServerAdmin admin@dominio.gov.br
    ServerName localhost
    
    DirectoryIndex index.php index.html
    IndexIgnore *
    EnableSendfile Off
    HostnameLookups Off
    ServerSignature Off
    AddDefaultCharset iso-8859-1

    <Directory />
        AllowOverride None
        Require all denied
    </Directory>

    AddEncoding br .br

    <FilesMatch "\.css\.br$">
        ForceType text/css
    </FilesMatch>

    <FilesMatch "\.js\.br$">
        ForceType application/javascript
    </FilesMatch>

    <FilesMatch "\.svg\.br$">
        ForceType image/svg+xml
    </FilesMatch>

    <Directory ~ "(/opt/sei/web|/opt/sip/web|/opt/infra/infra_css|/opt/infra/infra_js)" >
        AllowOverride None
        # Necessário para rewrite
        Options SymLinksIfOwnerMatch
        Require all granted
        # Caso exista um arquivo .br dos assets vai ser enviado.
        # Rewrite deve ser dentro do directory devido ao uso do Alias acima.
        RewriteEngine On
        RewriteCond %{HTTP:Accept-Encoding} br
        RewriteCond %{REQUEST_FILENAME}.br -f
        # Serve o arquivo .br correspondente
        RewriteRule ^ %{REQUEST_URI}.br [END]
    </Directory>

</VirtualHost>
